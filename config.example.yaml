# Matrix <-> ATProto bridge configuration.
#
# Copy this file to config.yaml and fill in real values. Secrets (tokens)
# should never be committed to version control.
#
# This file only holds what you need to get going. Every other setting has a
# sensible default and is documented in CONFIG.md -- add one here, under the
# section CONFIG.md lists it in, only if you want to change it.

bridge:
  # Domain local users' ATProto handles live directly under: the Matrix user
  # @alice:example.org gets the handle alice.example.org. Needs a wildcard DNS
  # record and TLS certificate for *.<domain> -- see INSTALL.md.
  domain: example.org

  # Address of the bridge's own PDS: one hostname for everyone, separate from
  # the per-user handle hostnames. Choose before creating accounts: it is
  # written into every account's public identity record.
  public_base_url: https://pds.example.org

  # Host/port the bridge's own HTTP server binds to.
  listen_host: 127.0.0.1
  listen_port: 8091

  # Each user gets a personal space (their Profile Room, their notifications
  # room, and the rooms of accounts they follow) and a notifications room.
  # Avatars are mxc:// URIs; left unset, the bot's avatar is used.
  space_name: "AT Proto"
  # space_avatar_mxc: "mxc://example.org/abcdef"
  notifications_room_name: "AT Proto Notifications"
  # notifications_room_avatar_mxc: "mxc://example.org/abcdef"

synapse:
  # Client-Server API base URL of your homeserver, as reachable from the
  # bridge process.
  base_url: http://127.0.0.1:8008
  # The homeserver's server_name (the part after the colon in @user:server.name).
  server_name: example.org

appservice:
  # Where `python -m bridge.appservice` writes the registration file your
  # homeserver must load (app_service_config_files in Synapse).
  registration_path: ./appservice-registration.yaml
  id: matrix-atproto-bridge
  # scripts/setup.sh fills these in. To generate one by hand:
  #   python3 -c 'import secrets; print(secrets.token_hex(32))'
  hs_token: "hs_replace_me"
  as_token: "as_replace_me"

  # The bridge's bot account, @<bot_localpart>:<server_name>. Users invite it
  # to a room to set up their identity. Must not be an existing user.
  bot_localpart: bluesky
  bot_display_name: "Bluesky Bridge"
  # An mxc:// URI, not a file path or http(s) URL.
  # bot_avatar_mxc: "mxc://example.org/abcdef"

  # Localpart prefix for ghosts of remote ATProto accounts,
  # e.g. "at_" -> @at_<account id>:example.org.
  # DECIDE NOW: changing it later orphans the existing ghosts, and the
  # registration file must be regenerated and the homeserver restarted.
  user_prefix: "at_"

  # Commands are given by tagging the bot or by starting a message with this
  # prefix ("]create profile"). Use something no other bot in your rooms
  # answers to -- matrix-appservice-activitypub uses ";".
  command_prefix: "]"

storage:
  # Where the bridge's own bookkeeping (bridge.db) is kept. Back it up: it
  # holds the signing keys every account's identity depends on.
  data_dir: ./data

handles:
  # Subdomains of `domain` that are in use, or that you want kept free, so
  # nobody can claim them as a handle. Exact labels or shell-style globs.
  # (Common names like www, mail and admin are already blocked, and a
  # subdomain that is live right now is detected automatically.)
  reserved: []
  #  - wiki
  #  - git
  #  - "node*"

logging:
  level: INFO
